name: android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Tests
        run: bash tests/run.sh
      - name: Curator tests
        run: python3 -m unittest discover -s curator
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ci.keystore
            printf 'KS_FILE=ci.keystore\nKS_PASS=%s\n' "$KS_PASS" > signing.env
          else
            keytool -genkeypair -keystore ci.keystore -storepass throwaway -keypass throwaway -alias ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Stash Reader CI"
            printf 'KS_FILE=ci.keystore\nKS_PASS=throwaway\n' > signing.env
          fi
      - name: Build
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" bash build.sh
      - uses: actions/upload-artifact@v4
        with: { name: StashReader-apk, path: StashReader.apk }

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: StashReader-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator run 1
        id: run1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/smoke.sh
      - name: Emulator run 2 (retry once)
        if: steps.run1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke.png
            smoke_open.png
            smoke_reader1.png
            smoke_kept.png
            smoke_stash.png
            smoke_topics.png
            smoke2.png
            smoke3.png
            smoke4.png
            smoke_share.png
            smoke_filter.png
            logcat.txt
          if-no-files-found: warn

  release:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: StashReader-apk }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" StashReader.apk --title "Stash Reader $GITHUB_REF_NAME" --notes-file release-notes.md
