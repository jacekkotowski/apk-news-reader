<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stash Reader</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--line:#e2ddd2;--text:#1b2a41;--dim:#5d6b7c;--gold:#9a6a10;--chip:#ece6d8;--accent:#1f5f8b;--bad:#b3392b;--ok:#2e7d5b}
:root[data-theme=dark]{--bg:#1b2a41;--card:#24364f;--line:#34496a;--text:#e8edf3;--dim:#9fb0c3;--gold:#f5c26b;--chip:#2e4465;--accent:#8cc4ee;--bad:#ff9a8a;--ok:#7fd1a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
header h1{font-size:20px;margin:0;white-space:nowrap}
header small{color:var(--dim);font-size:12px;flex:1;line-height:1.2}
button{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px;color:var(--text)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
main{flex:1;overflow-y:auto;padding:8px 16px 24px}
nav{display:flex;border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:14px 0}
nav button.on{color:var(--gold);font-weight:700}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.meta{font-size:12.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 10px}
.meta b{color:var(--gold);font-weight:600}
.card h3{font-size:18px;line-height:1.3;margin:6px 0;overflow-wrap:anywhere}
.ex{color:var(--dim);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.open .ex{display:none}
.why{font-size:12.5px;color:var(--dim);font-style:italic;margin-top:6px}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:1px 9px;font-size:12px;color:var(--dim);margin-top:8px}
.body{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;overflow-wrap:anywhere}
.open .body{display:block}
.label{font-size:12px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
:root{--fs:17px}.text{font-size:var(--fs);line-height:1.6}.tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px}.tools .btn{padding:2px 12px}.note{color:var(--bad);font-size:13px;margin-top:8px}
.text a{color:var(--accent)}.text pre{overflow-x:auto;background:var(--chip);padding:8px;border-radius:8px;font-size:14px}
.text code{background:var(--chip);padding:0 4px;border-radius:4px;font-size:.9em}.text pre code{padding:0;background:none}
.text blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line);color:var(--dim)}
.text table{border-collapse:collapse;display:block;overflow-x:auto}.text td,.text th{border:1px solid var(--line);padding:3px 6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;color:var(--dim);padding:40px 16px}
.src{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.src .t{flex:1;min-width:0;overflow-wrap:anywhere}.src .t div{font-size:12.5px;color:var(--dim)}
.src .err{color:var(--bad)}.src .good{color:var(--ok)}
.wt{min-width:18px;text-align:center;font-weight:700;margin-top:6px}
.src input{width:22px;height:22px;margin-top:3px}
.add{display:flex;gap:8px;margin:12px 0}.add input{flex:1;min-width:0;padding:8px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
#msg{color:var(--bad);font-size:13px;min-height:18px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:14px 0 4px}
</style></head><body>
<header><h1>Stash Reader</h1><small id="stat"></small><button class="btn" id="refresh">Refresh</button></header>
<main>
<section id="feed" class="on"></section>
<section id="kept"></section>
<section id="topics">
  <div class="add"><input id="topic" type="text" placeholder="Add a topic, e.g. causal inference" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn main" id="addtopic">Add</button></div>
  <p class="meta">Weight 0 switches a topic off, 5 is the strongest. The feed is ordered by these topics, by what you keep, and by freshness.</p>
  <div id="topiclist"></div>
</section>
<section id="sources">
  <div class="add"><input id="url" type="text" placeholder="Blog or feed address, e.g. example.com" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn main" id="add">Add</button></div>
  <div id="msg"></div>
  <h2>Background refresh</h2>
  <select id="hours" class="btn"><option value="0">Off</option><option value="3">Every 3 hours</option><option value="6">Every 6 hours</option><option value="12">Every 12 hours</option><option value="24">Every day</option></select>
  <h2>Sources</h2><div id="srclist"></div>
  <p class="meta" id="ver"></p>
</section>
</main>
<nav><button data-t="feed" class="on">Feed</button><button data-t="kept">Kept</button><button data-t="topics">Topics</button><button data-t="sources">Sources</button></nav>
<script src="Readability.js"></script>
<script>
var A=window.Android||{feed:function(){return '[]'},kept:function(){return '[]'},sources:function(){return '[]'},status:function(){return '{}'},item:function(){return '{}'},version:function(){return 'dev'}};
var tab='feed',wasBusy=false,lastSig='';
function setTheme(d){document.documentElement.setAttribute('data-theme',d?'dark':'light')}
try{setTheme(A.dark&&A.dark())}catch(e){}
function J(s){try{return JSON.parse(s)}catch(e){return []}}
function $(id){return document.getElementById(id)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ago(ms){var m=Math.round((Date.now()-ms)/60000);if(m<60)return Math.max(m,1)+' min ago';var h=Math.round(m/60);if(h<48)return h+' h ago';return Math.round(h/24)+' d ago'}

function fontSize(){var v=17;try{v=parseInt(localStorage.getItem('fs'))||17}catch(e){}return Math.max(13,Math.min(28,v))}
function setFont(d){var v=Math.max(13,Math.min(28,fontSize()+d));try{localStorage.setItem('fs',v)}catch(e){}document.documentElement.style.setProperty('--fs',v+'px')}
document.documentElement.style.setProperty('--fs',fontSize()+'px');
function card(it,kept){
  var c=el('div','card');
  var m=el('div','meta');m.appendChild(el('b',null,it.source));m.appendChild(el('span',null,ago(it.pub)));m.appendChild(el('span',null,it.mins+' min'));
  c.appendChild(m);
  var h=el('h3',null,it.title);c.appendChild(h);
  c.appendChild(el('p','ex',it.excerpt));
  if(it.why)c.appendChild(el('div','why','Why this: '+it.why));
  if(it.topic)c.appendChild(el('span','chip',it.topic));
  var b=el('div','body');c.appendChild(b);
  var loaded=false,d={},failed=false,label,text,note,readBtn;
  function paint(){
    if(d.article){label.textContent='Full article, reader mode (saved on this phone)';text.innerHTML=d.article}
    else{
      label.textContent=failed?'Excerpt':(d.full?'Full text, as sent by the feed':'Summary from the feed, not the full article');
      if(d.html)text.innerHTML=d.html;else text.textContent=d.excerpt||'No text was saved for this item.';
    }
  }
  function fail(msg){failed=true;note.textContent=msg+' Use Open in browser to read it.';paint();readBtn.textContent='Try reader mode again';readBtn.disabled=false}
  function extract(html){
    try{
      var doc=new DOMParser().parseFromString(html,'text/html');
      var base=doc.createElement('base');base.href=d.link;doc.head.insertBefore(base,doc.head.firstChild);
      var art=new Readability(doc).parse();
      if(art&&art.textContent&&art.textContent.trim().length>=300){
        A.saveArticle(it.id,art.content);d=J(A.item(it.id));failed=false;note.textContent='';paint();
        if(d.article){readBtn.style.display='none'}else fail('The article text could not be saved.');
      }else fail('Reader mode could not find the article text on that page.');
    }catch(e){fail('Reader mode failed on that page.')}
  }
  function poll(n){
    var r=A.pageResult(it.id);
    if(!r){if(n>80)fail('The page took too long to load.');else setTimeout(function(){poll(n+1)},500)}
    else if(r.indexOf('err:')===0)fail('Could not load the page: '+r.slice(4)+'.');
    else extract(r.slice(3));
  }
  function toggle(){
    var open=c.classList.toggle('open');
    if(open&&!loaded){loaded=true;
      d=J(A.item(it.id));
      var tools=el('div','tools');
      var sm=el('button','btn','A-');sm.onclick=function(e){e.stopPropagation();setFont(-1)};
      var lg=el('button','btn','A+');lg.onclick=function(e){e.stopPropagation();setFont(1)};
      tools.appendChild(sm);tools.appendChild(lg);b.appendChild(tools);
      label=el('div','label');b.appendChild(label);
      text=el('div','text');b.appendChild(text);
      text.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a');if(a){e.preventDefault();e.stopPropagation();if(a.href)A.openUrl(a.href)}});
      note=el('div','note');b.appendChild(note);
      paint();
      var acts=el('div','acts');
      if(!kept){
        var k=el('button','btn main','Keep');k.onclick=function(e){e.stopPropagation();A.keep(it.id);gone(c)};acts.appendChild(k);
        var dn=el('button','btn','Done');dn.onclick=function(e){e.stopPropagation();A.done(it.id);gone(c)};acts.appendChild(dn);
        var ls=el('button','btn','Less like this');ls.onclick=function(e){e.stopPropagation();A.less(it.id);gone(c)};acts.appendChild(ls);
      }else{
        var u=el('button','btn','Remove from Kept');u.onclick=function(e){e.stopPropagation();A.unkeep(it.id);gone(c)};acts.appendChild(u);
      }
      readBtn=el('button','btn','Read full article');
      readBtn.onclick=function(e){e.stopPropagation();readBtn.disabled=true;readBtn.textContent='Loading page...';note.textContent='';A.fetchPage(it.id);poll(0)};
      if(d.link&&!d.article)acts.appendChild(readBtn);
      if(d.link){var o=el('button','btn','Open in browser');o.onclick=function(e){e.stopPropagation();A.openUrl(d.link)};acts.appendChild(o)}
      b.appendChild(acts);
    }
  }
  c.addEventListener('click',function(e){if(!c.classList.contains('open')||e.target===h||e.target.closest('.meta'))toggle()});
  return c;
}
function gone(c){var p=c.parentNode;p.removeChild(c);if(!p.querySelector('.card'))render()}

function render(){
  var s=J(A.status());
  if(tab==='feed'){
    var box=$('feed');box.textContent='';
    var items=J(A.feed());
    items.forEach(function(it){box.appendChild(card(it,false))});
    if(!items.length)box.appendChild(el('div','empty',s.refreshing?'Loading your sources...':'You have read everything new. Press Refresh later for more.'));
    else if(items.length>=300)box.appendChild(el('div','empty','Showing the newest 300. Mark some as Done to see older ones.'));
  }else if(tab==='kept'){
    var kb=$('kept');kb.textContent='';
    var ki=J(A.kept());
    ki.forEach(function(it){kb.appendChild(card(it,true))});
    if(!ki.length)kb.appendChild(el('div','empty','Nothing kept yet. Open a card in the Feed and press Keep.'));
  }else if(tab==='topics'){
    var tl=$('topiclist');tl.textContent='';
    J(A.topics()).forEach(function(x){
      var r=el('div','src');
      var t=el('div','t');t.appendChild(el('span',null,x.phrase));r.appendChild(t);
      var minus=el('button','btn','-');minus.onclick=function(){A.setTopicWeight(x.id,x.weight-1);render()};
      var w=el('span','wt',''+x.weight);
      var plus=el('button','btn','+');plus.onclick=function(){A.setTopicWeight(x.id,x.weight+1);render()};
      var rm=el('button','btn','x');rm.onclick=function(){A.removeTopic(x.id);render()};
      r.appendChild(minus);r.appendChild(w);r.appendChild(plus);r.appendChild(rm);
      tl.appendChild(r);
    });
  }else{
    var l=$('srclist');l.textContent='';
    J(A.sources()).sort(function(a,b){return (b.error?1:0)-(a.error?1:0)}).forEach(function(x){
      var r=el('div','src');
      var cb=el('input');cb.type='checkbox';cb.checked=x.enabled;cb.onchange=function(){A.setSourceEnabled(x.id,cb.checked);status()};r.appendChild(cb);
      var t=el('div','t');t.appendChild(el('span',null,x.name||x.url));
      var d=el('div',x.error?'err':(x.lastOk?'good':''),x.error?x.error:(x.lastOk?'OK, '+x.count+' items, updated '+ago(x.lastOk):'Not refreshed yet'));
      t.appendChild(d);
      t.appendChild(el('div',null,(x.topic?x.topic+' | ':'')+x.url));
      r.appendChild(t);
      if(x.custom){var rm=el('button','btn','Remove');rm.onclick=function(){A.removeSource(x.id);render()};r.appendChild(rm)}
      l.appendChild(r);
    });
    $('ver').textContent='Stash Reader '+A.version();
    var sel=$('hours');if(sel&&A.refreshHours)sel.value=''+A.refreshHours();
  }
}
function status(){
  var s=J(A.status());
  $('stat').textContent=s.refreshing?'Refreshing...':(s.fresh!=null?s.fresh+' new'+(s.failed?', '+s.failed+' source(s) with errors':''):'');
  $('refresh').disabled=!!s.refreshing;
  if(wasBusy&&!s.refreshing)render();
  wasBusy=!!s.refreshing;
}
function show(t){
  tab=t;['feed','kept','topics','sources'].forEach(function(n){$(n).classList.toggle('on',n===t)});
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  render();document.querySelector('main').scrollTop=0;
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){show(b.dataset.t)}});
$('refresh').onclick=function(){A.refresh();setTimeout(status,300)};
$('add').onclick=function(){
  var m=A.addSource($('url').value);$('msg').textContent=m;if(m)return;
  $('add').disabled=true;$('msg').textContent='Checking the address...';
  (function wait(){var r=A.addStatus();
    if(r.indexOf('done:')===0){$('add').disabled=false;var e=r.slice(5);$('msg').textContent=e;if(!e){$('url').value='';wasBusy=true}render()}
    else setTimeout(wait,600)})();
};
$('hours').onchange=function(){A.setRefreshHours(parseInt($('hours').value))};
$('addtopic').onclick=function(){if(A.addTopic($('topic').value))$('topic').value='';render()};
render();status();setInterval(status,1500);
</script>
</body></html>
